<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="art-gov-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9FC"/>
      <stop offset="100%" stop-color="#F1EAF5"/>
    </linearGradient>
    <linearGradient id="art-dome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#734B8C"/>
      <stop offset="100%" stop-color="#362244"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#art-gov-bg)"/>
  <circle cx="200" cy="125" r="95" fill="#EADAEE" opacity="0.4"/>

  <!-- Top-Left: Governmental Surveillance Satellite / Radar Array -->
  <g transform="translate(85, 65)">
    <!-- Radar Dish -->
    <path d="M -22,-12 A 25,25 0 0,0 12,22 L -5,5 Z" fill="#734B8C"/>
    <line x1="-5" y1="5" x2="12" y2="-12" stroke="#5B3A70" stroke-width="3"/>
    <circle cx="12" cy="-12" r="3" fill="#E85D4A"/>
    <!-- Radar Scan Waves reaching toward center -->
    <path d="M 22,25 C 45,45 70,55 105,65" fill="none" stroke="#E85D4A" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 32,15 C 55,35 80,45 115,55" fill="none" stroke="#E85D4A" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  </g>

  <!-- Center: Impenetrable Zero-Logs OllaVPN Cryptographic Dome -->
  <g transform="translate(210, 140)">
    <!-- Globe Base -->
    <path d="M -70,25 Q 0,45 70,25" fill="none" stroke="#D8B4E2" stroke-width="2"/>
    <ellipse cx="0" cy="25" rx="70" ry="12" fill="#EADAEE" opacity="0.6"/>
    
    <!-- Impenetrable Encrypted Geodesic Shield Dome -->
    <path d="M -55,25 C -55,-35 0,-65 0,-65 C 0,-65 55,-35 55,25 Z" fill="url(#art-dome)"/>
    <!-- Facet Lines on Dome -->
    <path d="M 0,-65 L -30, -10 L 0,25 L 30, -10 Z" fill="none" stroke="#D8B4E2" stroke-width="1.5"/>
    <line x1="-55" y1="25" x2="-30" y2="-10" stroke="#D8B4E2" stroke-width="1.5"/>
    <line x1="55" y1="25" x2="30" y2="-10" stroke="#D8B4E2" stroke-width="1.5"/>
    
    <!-- Central Shield Padlock Core -->
    <circle cx="0" cy="-8" r="10" fill="#F8F5FA"/>
    <rect x="-4" y="-7" width="8" height="7" rx="2" fill="#5B3A70"/>
    <path d="M -2.5,-7 V -10 C -2.5 -11.5 -1 -12.5 0 -12.5 C 1 -12.5 2.5 -11.5 2.5 -10 V -7" fill="none" stroke="#5B3A70" stroke-width="1.5"/>
  </g>
</svg>