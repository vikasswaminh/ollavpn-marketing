<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="art-isp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9FC"/>
      <stop offset="100%" stop-color="#F1EAF5"/>
    </linearGradient>
    <linearGradient id="art-isp-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#734B8C"/>
      <stop offset="100%" stop-color="#4A2D5C"/>
    </linearGradient>
  </defs>
  <!-- Background Canvas -->
  <rect width="400" height="250" fill="url(#art-isp-bg)"/>
  <circle cx="200" cy="125" r="95" fill="#EADAEE" opacity="0.4"/>
  
  <!-- Left: ISP Cable & Exposed Packets -->
  <g stroke="#9C89A8" stroke-width="2" fill="none">
    <path d="M 40,95 C 90,95 110,115 150,115" stroke-dasharray="4 4"/>
    <path d="M 40,125 L 150,125"/>
    <path d="M 40,155 C 90,155 110,135 150,135" stroke-dasharray="4 4"/>
  </g>
  <circle cx="80" cy="125" r="5" fill="#E85D4A"/>
  <circle cx="120" cy="125" r="5" fill="#E85D4A"/>
  <!-- ISP Observant Eye Icon (Snooping) -->
  <g transform="translate(60, 65)">
    <path d="M 0,15 Q 20,0 40,15 Q 20,30 0,15 Z" fill="#FFFFFF" stroke="#734B8C" stroke-width="2"/>
    <circle cx="20" cy="15" r="6" fill="#5B3A70"/>
    <circle cx="22" cy="13" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Center-Right: Impenetrable OllaVPN Shield Cloaking the Data -->
  <g transform="translate(230, 125)">
    <!-- Shadow -->
    <path d="M 0,-62 C 38,-62 48,-42 48,10 C 48,54 0,76 0,76 C 0,76 -48,54 -48,10 C -48,-42 -38,-62 0,-62 Z" fill="#2E1C3B" opacity="0.15" transform="translate(0, 6)"/>
    <!-- Main Shield -->
    <path d="M 0,-62 C 38,-62 48,-42 48,10 C 48,54 0,76 0,76 C 0,76 -48,54 -48,10 C -48,-42 -38,-62 0,-62 Z" fill="url(#art-isp-shield)"/>
    <!-- Padlock Emblem inside Shield -->
    <rect x="-14" y="-8" width="28" height="24" rx="6" fill="#F8F5FA"/>
    <path d="M -9,-8 V -16 C -9 -21 -4 -25 0 -25 C 4 -25 9 -21 9 -16 V -8" fill="none" stroke="#F8F5FA" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="2" r="3" fill="#5B3A70"/>
    <polygon points="-2,2 2,2 3,9 -3,9" fill="#5B3A70"/>
  </g>

  <!-- Protected Zero-Knowledge Stream out of Shield -->
  <g stroke="#10B981" stroke-width="2.5" stroke-linecap="round">
    <line x1="285" y1="125" x2="360" y2="125"/>
    <line x1="285" y1="105" x2="340" y2="105" stroke-dasharray="3 3"/>
    <line x1="285" y1="145" x2="340" y2="145" stroke-dasharray="3 3"/>
  </g>
  <circle cx="350" cy="125" r="4" fill="#10B981"/>
</svg>