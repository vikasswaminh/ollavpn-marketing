<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 175" width="100%" height="100%">
  <defs>
    <linearGradient id="cf-mh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281636"/>
      <stop offset="100%" stop-color="#1A0D24"/>
    </linearGradient>
    <radialGradient id="cf-mh-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#734B8C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#734B8C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="280" height="175" fill="url(#cf-mh-bg)"/>
  <circle cx="140" cy="87.5" r="60" fill="url(#cf-mh-glow)"/>

  <!-- Centered Frame Badge -->
  <g transform="translate(140, 87.5)">
    <!-- Outer Centered Circle Frame -->
    <circle cx="0" cy="0" r="48" fill="#362244" stroke="#734B8C" stroke-width="2"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#A279BF" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>

    <!-- 3 Triangular Interconnected Tunnel Vectors -->
    <polygon points="0,-18 18,14 -18,14" fill="none" stroke="#734B8C" stroke-width="2"/>
    <polygon points="0,-18 18,14 -18,14" fill="none" stroke="#D8B4E2" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- 3 Symmetrical Relay Server Nodes -->
    <!-- Top Entry Node -->
    <circle cx="0" cy="-18" r="7" fill="#5B3A70" stroke="#F8F5FA" stroke-width="1.5"/>
    <circle cx="0" cy="-18" r="2.5" fill="#10B981"/>
    <!-- Bottom Right Mid Node -->
    <circle cx="18" cy="14" r="7" fill="#5B3A70" stroke="#F8F5FA" stroke-width="1.5"/>
    <circle cx="18" cy="14" r="2.5" fill="#10B981"/>
    <!-- Bottom Left Exit Node -->
    <circle cx="-18" cy="14" r="7" fill="#5B3A70" stroke="#F8F5FA" stroke-width="1.5"/>
    <circle cx="-18" cy="14" r="2.5" fill="#10B981"/>
  </g>
</svg>