<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="art-tr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9FC"/>
      <stop offset="100%" stop-color="#F1EAF5"/>
    </linearGradient>
    <linearGradient id="art-barrier" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A279BF"/>
      <stop offset="50%" stop-color="#734B8C"/>
      <stop offset="100%" stop-color="#362244"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#art-tr-bg)"/>
  <circle cx="200" cy="125" r="95" fill="#EADAEE" opacity="0.4"/>

  <!-- Left: Advertising Crosshair Tracking Reticle with Fingerprint -->
  <g transform="translate(130, 125)">
    <!-- Tracking Target Circles -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#D8B4E2" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#A279BF" stroke-width="2"/>
    <!-- Crosshair ticks -->
    <line x1="0" y1="-62" x2="0" y2="-45" stroke="#E85D4A" stroke-width="3"/>
    <line x1="0" y1="62" x2="0" y2="45" stroke="#E85D4A" stroke-width="3"/>
    <line x1="-62" y1="0" x2="-45" y2="0" stroke="#E85D4A" stroke-width="3"/>
    <line x1="62" y1="0" x2="45" y2="0" stroke="#E85D4A" stroke-width="3"/>

    <!-- Fingerprint Arcs -->
    <g fill="none" stroke="#734B8C" stroke-width="2.5" stroke-linecap="round">
      <path d="M 0,-18 A 18,18 0 0,1 18,0 C 18,12 12,20 6,24"/>
      <path d="M -10,-12 A 12,12 0 0,1 10,0 C 10,8 6,14 0,18"/>
      <path d="M -4,-4 A 4,4 0 0,1 4,0 C 4,5 0,10 -2,12"/>
      <path d="M -16,0 C -16,-10 -6,-22 8,-22"/>
    </g>
  </g>

  <!-- Clean Privacy Slash & Barrier Wall -->
  <g transform="translate(225, 125)">
    <!-- Deflecting Privacy Barrier -->
    <rect x="-8" y="-70" width="16" height="140" rx="8" fill="url(#art-barrier)"/>
    <!-- Shield Padlock Icon on Barrier -->
    <circle cx="0" cy="0" r="16" fill="#FFFFFF"/>
    <rect x="-6" y="-3" width="12" height="10" rx="2.5" fill="#734B8C"/>
    <path d="M -4,-3 V -6 C -4 -8.5 -2 -10 0 -10 C 2 -10 4 -8.5 4 -6 V -3" fill="none" stroke="#734B8C" stroke-width="2"/>
    
    <!-- Deflection Waves -->
    <path d="M -18,-35 Q -32,-20 -18, -5" fill="none" stroke="#E85D4A" stroke-width="2" stroke-linecap="round"/>
    <path d="M -18,5 Q -32,20 -18, 35" fill="none" stroke="#E85D4A" stroke-width="2" stroke-linecap="round"/>
    <!-- Safe Signal Beyond Barrier -->
    <circle cx="35" cy="0" r="6" fill="#10B981"/>
    <line x1="45" y1="0" x2="80" y2="0" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>