name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-main
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: [self-hosted, mkt]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          set -e
          rm -rf _site && mkdir -p _site
          tar -cf - --exclude=./.git --exclude=./.github --exclude=./_site . | tar -xf - -C _site

      - name: Publish to Cloudflare Pages
        # No credential is exposed to this job. The wrapper below runs as root
        # on the runner host, loads the token itself, and only ever publishes
        # to this repo's own Pages project.
        run: sudo -n /usr/local/sbin/mkt-deploy-ollavpn "$GITHUB_WORKSPACE/_site"
