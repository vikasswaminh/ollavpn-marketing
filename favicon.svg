<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#D01F2D" flood-opacity="0.28" />
    </filter>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E22434"/>
      <stop offset="100%" stop-color="#C51826"/>
    </linearGradient>
  </defs>

  <!-- Red Rounded Squircle -->
  <rect x="12" y="10" width="104" height="104" rx="28" fill="url(#red-grad)" filter="url(#subtle-shadow)"/>

  <!-- Crisp Shield Outline -->
  <path d="M 64,33
           C 54,37.5 41.5,41 37,41
           L 37,64.5
           C 37,80.5 50.5,93 64,98
           C 77.5,93 91,80.5 91,64.5
           L 91,41
           C 86.5,41 74,37.5 64,33 Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="7.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Centered Checkmark -->
  <path d="M 52,65.5 L 61,74.5 L 76.5,56"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="7.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>