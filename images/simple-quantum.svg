<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 175" width="100%" height="100%">
  <defs>
    <linearGradient id="cf-pq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281636"/>
      <stop offset="100%" stop-color="#1A0D24"/>
    </linearGradient>
    <radialGradient id="cf-pq-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#734B8C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#734B8C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="280" height="175" fill="url(#cf-pq-bg)"/>
  <circle cx="140" cy="87.5" r="60" fill="url(#cf-pq-glow)"/>

  <!-- Centered Frame Badge -->
  <g transform="translate(140, 87.5)">
    <!-- Outer Centered Circle Frame -->
    <circle cx="0" cy="0" r="48" fill="#362244" stroke="#734B8C" stroke-width="2"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#A279BF" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>

    <!-- Quantum Orbital Rings -->
    <ellipse cx="0" cy="0" rx="26" ry="10" fill="none" stroke="#A279BF" stroke-width="1.5" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="26" ry="10" fill="none" stroke="#A279BF" stroke-width="1.5" transform="rotate(-30)"/>
    
    <!-- Central Post-Quantum Lattice Node -->
    <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="#734B8C" stroke="#D8B4E2" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#F8F5FA"/>
    <!-- Orbiting Qubit Electrons -->
    <circle cx="21" cy="-12" r="2.5" fill="#FDE68A"/>
    <circle cx="-21" cy="12" r="2.5" fill="#C084FC"/>
  </g>
</svg>