<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 175" width="100%" height="100%">
  <defs>
    <linearGradient id="cf-wg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281636"/>
      <stop offset="100%" stop-color="#1A0D24"/>
    </linearGradient>
    <radialGradient id="cf-wg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#734B8C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#734B8C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Card Background -->
  <rect width="280" height="175" fill="url(#cf-wg-bg)"/>
  <!-- Ambient Center Glow -->
  <circle cx="140" cy="87.5" r="60" fill="url(#cf-wg-glow)"/>

  <!-- Centered Frame Badge -->
  <g transform="translate(140, 87.5)">
    <!-- Outer Centered Circle Frame -->
    <circle cx="0" cy="0" r="48" fill="#362244" stroke="#734B8C" stroke-width="2"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#A279BF" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>

    <!-- Centered Shield Silhouette -->
    <path d="M 0,-26 C 18,-26 24,-18 24,2 C 24,20 0,32 0,32 C 0,32 -24,20 -24,2 C -24,-18 -18,-26 0,-26 Z" fill="#5B3A70"/>
    
    <!-- WireGuard Kinetic High-Speed Lightning Bolt -->
    <polygon points="3,-18 -12,2 -1,2 -5,18 13,-2 2,-2" fill="#FDE68A"/>
  </g>
</svg>