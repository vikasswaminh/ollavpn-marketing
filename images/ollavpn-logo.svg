<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Soft Red Ambient Shadow matching screenshot -->
    <filter id="soft-shadow" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#D01F2D" flood-opacity="0.32" />
    </filter>
    <!-- Rich Vibrant Red Gradient matching screenshot pixels (Top: #DF2535, Bottom: #C91B29) -->
    <linearGradient id="squircle-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E22737"/>
      <stop offset="50%" stop-color="#D41E2E"/>
      <stop offset="100%" stop-color="#BF1624"/>
    </linearGradient>
  </defs>

  <!-- Red Squircle (Transparent Outer Background) -->
  <rect x="14" y="10" width="100" height="100" rx="26" ry="26" fill="url(#squircle-grad)" filter="url(#soft-shadow)"/>

  <!-- Thick White Security Shield Outline matching screenshot -->
  <path d="M 64,31
           C 53.5,35.8 41,39.5 36.5,39.5
           L 36.5,63.5
           C 36.5,79.5 50,92.5 64,98
           C 78,92.5 91.5,79.5 91.5,63.5
           L 91.5,39.5
           C 87,39.5 74.5,35.8 64,31 Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="7.8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Crisp White Centered Checkmark matching screenshot -->
  <path d="M 51.5,64.5 L 61,74 L 76.5,55"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="7.8"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
