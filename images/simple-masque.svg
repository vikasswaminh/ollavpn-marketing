<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 175" width="100%" height="100%">
  <defs>
    <linearGradient id="cf-mq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281636"/>
      <stop offset="100%" stop-color="#1A0D24"/>
    </linearGradient>
    <radialGradient id="cf-mq-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#734B8C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#734B8C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="280" height="175" fill="url(#cf-mq-bg)"/>
  <circle cx="140" cy="87.5" r="60" fill="url(#cf-mq-glow)"/>

  <!-- Centered Frame Badge -->
  <g transform="translate(140, 87.5)">
    <!-- Outer Centered Circle Frame -->
    <circle cx="0" cy="0" r="48" fill="#362244" stroke="#734B8C" stroke-width="2"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#A279BF" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>

    <!-- Centered Datagram Layers (HTTP/3 & UDP Packet Encapsulation) -->
    <g fill="#5B3A70" stroke="#D8B4E2" stroke-width="1.5">
      <rect x="-22" y="-22" width="44" height="11" rx="3"/>
      <rect x="-22" y="-6" width="44" height="11" rx="3"/>
      <rect x="-22" y="10" width="44" height="11" rx="3"/>
    </g>
    <!-- Data Stream Packet Indicators -->
    <circle cx="-12" cy="-16.5" r="2" fill="#10B981"/>
    <circle cx="-12" cy="-0.5" r="2" fill="#10B981"/>
    <circle cx="-12" cy="15.5" r="2" fill="#10B981"/>
    <!-- Tunnel Verification Check -->
    <polyline points="4,-16.5 8,-14.5 14,-18.5" fill="none" stroke="#F8F5FA" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="4,-0.5 8,1.5 14,-2.5" fill="none" stroke="#F8F5FA" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="4,15.5 8,17.5 14,13.5" fill="none" stroke="#F8F5FA" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>